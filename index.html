<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lombongo - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/login_style.css">
    
</head>
<body>

    <div class="login-container">
        <!-- lado esquerdo -->
        <div class="left-side">
            <div class="hero-visual-container">
                <div class="logo-icon">
                    <a href="lomgongo_login.html"><i class="fa-solid fa-rocket"></i> <span>Lombongo</span></a>
                </div>
                <div class="hero-visual">

                    <div class="card card-product">
                        <div class="card-media">
                            <img src="assets/img/card_produto.png" alt="Embalagem de Produto Orgânico">
                        </div>
                    </div>

                    <div class="card card-main">
                        <div class="card-header-main">
                            <div class="avatar-mock"><i class="fa-solid fa-rocket"></i></div>
                            <div class="bar-mock card-text-bar"></div>
                        </div>
                        <div class="card-media">
                            <img src="assets/img/IMG_0552.jpg" alt="Casal Empreendedor usando Laptop">
                        </div>
                    </div>

                    <div class="card card-seller">
                        <div class="card-header">
                            <div class="avatar-mock"><i class="fa-solid fa-rocket"></i></div>
                            <div class="bar-mock card-text-bar-sm"></div>
                        </div>
                        <div class="card-media">
                            <img src="assets/img/homem_produto.jpg" alt="Vendedor Sorrindo">
                        </div>
                        <div class="card-footer">
                            <div class="bar-mock card-desc-bar full"></div>
                            <div class="bar-mock card-desc-bar short"></div>
                            <div class="bar-mock card-desc-bar so-short"></div>
                        </div>
                    </div>

                    <div class="avatar-profile">
                        <div class="avatar-profile-inner"> <img src="assets/img/self_perfil_200px.png" alt="profile"> </div>
                    </div>

                    <div class="icon-bubble like like-1">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>
                    </div>
                    <div class="icon-bubble like like-2">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>
                    </div>

                    <div class="icon-bubble share">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
                    </div>

                    <div class="icon-bubble comment">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
                        </svg>
                    </div>
                </div>
            </div>
        </div>

        <script>
            document.addEventListener('DOMContentLoaded', function() {
              console.log('Landing page Lombongo carregada!');
            
              
              const visualContainer = document.querySelector('.hero-visual');
              visualContainer.addEventListener('mouseover', function() {
                const animatedElements = this.querySelectorAll('[style*="animation"]');
                animatedElements.forEach(el => el.style.animationPlayState = 'paused');
              });
              visualContainer.addEventListener('mouseout', function() {
                const animatedElements = this.querySelectorAll('[style*="animation"]');
                animatedElements.forEach(el => el.style.animationPlayState = 'running');
              });
              
            });
        </script>

        <!-- Lado Direito - Login -->
        <div class="right-side">
            <div class="logo-icon_right">
                <a href="lomgongo_login.html"><i class="fa-solid fa-rocket"></i> <span>Lombongo</span></a>
            </div>
            <div class="login-header">
                <h2>Faça o Login na sua conta</h2>
                <p>Digite suas credenciais para acessar o Lombongo</p>
            </div>

            <!-- Mensagens -->
            <div class="alert-box" id="errorAlert">
                <i class="fas fa-exclamation-circle"></i>
                <span>E-mail ou senha incorretos.</span>
            </div>

            <div class="success-box" id="successAlert">
                <i class="fas fa-check-circle"></i>
                <span>Login realizado com sucesso! Redirecionando...</span>
            </div>

            <form class="login-form" id="loginForm" novalidate>
                <!-- Email/Telefone -->
                <div class="input-group">
                    <label class="input-label" for="email">
                       
                        E-mail ou Telefone
                    </label>
                    <div class="input-wrapper">
                        <!-- <i class="fas fa-envelope input-icon"></i> -->
                        <input 
                            type="text" 
                            class="input-field" 
                            id="email" 
                            placeholder="Digite seu e-mail ou telefone"
                            autocomplete="email"
                        >
                    </div>
                    <div class="error-message" id="emailError">
                        <i class="fas fa-exclamation-triangle"></i>
                        <span>Por favor, insira seu e-mail ou telefone.</span>
                    </div>
                </div>

                <!-- Senha -->
                <div class="input-group">
                    <label class="input-label" for="password">    
                        Senha
                    </label>
                    <div class="input-wrapper password-wrapper">
                        <!-- <i class="fas fa-key input-icon"></i> -->
                        <input 
                            type="password" 
                            class="input-field" 
                            id="password" 
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                        >
                        <span class="toggle-password" id="togglePassword">
                            <i class="fas fa-eye" id="eyeIcon"></i>
                        </span>
                    </div>
                    <div class="error-message" id="passwordError">
                        <i class="fas fa-exclamation-triangle"></i>
                        <span>Por favor, insira sua senha.</span>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" id="btnLogin">
                    <i class="fas fa-sign-in-alt"></i>
                    Entrar
                </button>

                <a href="#">
                    <button type="button" class="btn btn-secondary" onclick="window.location.href='#'">
                        <i class="fas fa-user-plus"></i>
                        Criar nova contagit add .
                        Google
                    </button>
                    <button type="button" class="btn-social facebook" id="btnFacebook">
                        <i class="fab fa-facebook-f"></i>
                        Facebook
                    </button>
                </div> -->
            </form>
        </div>
    </div>

    <script>
        // Elementos do DOM
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const togglePassword = document.getElementById('togglePassword');
        const eyeIcon = document.getElementById('eyeIcon');
        const btnLogin = document.getElementById('btnLogin');
        const errorAlert = document.getElementById('errorAlert');
        const successAlert = document.getElementById('successAlert');

        // Toggle Password Visibility
        togglePassword.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            if (type === 'text') {
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        });

        // Validação em tempo real - remover erro ao digitar
        emailInput.addEventListener('input', function() {
            this.classList.remove('error');
            document.getElementById('emailError').classList.remove('show');
        });

        passwordInput.addEventListener('input', function() {
            this.classList.remove('error');
            document.getElementById('passwordError').classList.remove('show');
        });

        // Validação do Formulário
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            let isValid = true;
            
            // Resetar mensagens
            errorAlert.classList.remove('show');
            successAlert.classList.remove('show');
            
            // Validar Email/Telefone
            if (!emailInput.value.trim()) {
                emailInput.classList.add('error');
                document.getElementById('emailError').classList.add('show');
                isValid = false;
            }
            
            // Validar Senha
            if (!passwordInput.value.trim()) {
                passwordInput.classList.add('error');
                document.getElementById('passwordError').classList.add('show');
                isValid = false;
            }
            
            if (!isValid) return;
            
            // Simular loading
            btnLogin.classList.add('btn-loading');
            btnLogin.disabled = true;
            
            // Simular chamada à API (2 segundos)
            setTimeout(() => {
                btnLogin.classList.remove('btn-loading');
                btnLogin.disabled = false;
                
                // Simular sucesso (em produção, isso viria do backend)
                // Para demonstrar erro, descomente as linhas abaixo:
                // showError();
                // return;
                
                showSuccess();
                
                // Redirecionar após 2 segundos
                setTimeout(() => {
                    window.location.href = 'index.html';
                    console.log('Redirecionando para dashboard...');
                }, 1000);
                
            }, 2000);
        });

        // Mostrar erro
        function showError() {
            errorAlert.classList.add('show');
            emailInput.classList.add('error');
            passwordInput.classList.add('error');
            
            // Scroll para o topo do formulário
            errorAlert.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // Mostrar sucesso
        function showSuccess() {
            successAlert.classList.add('show');
            errorAlert.classList.remove('show');
        }

        // Login Social - Google
        document.getElementById('btnGoogle').addEventListener('click', function() {
            console.log('Iniciando login com Google...');
            // Implementar OAuth Google aqui
            // window.location.href = '/auth/google';
        });

        // Login Social - Facebook
        document.getElementById('btnFacebook').addEventListener('click', function() {
            console.log('Iniciando login com Facebook...');
            // Implementar OAuth Facebook aqui
            // window.location.href = '/auth/facebook';
        });

        // Efeito parallax suave no fundo animado
        window.addEventListener('scroll', () => {
            const scrolled = window.pageYOffset;
            const animatedBg = document.querySelector('.animated-bg');
            const particles = document.querySelector('.particles');
            
            if (window.innerWidth > 768) {
                const yPos = scrolled * 0.3;
                animatedBg.style.transform = `translateY(${yPos}px)`;
                particles.style.transform = `translateY(${yPos * 0.5}px)`;
            }
        });

        // Prevenir envio ao pressionar Enter em campos vazios
        emailInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                passwordInput.focus();
            }
        });

        passwordInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                loginForm.dispatchEvent(new Event('submit'));
            }
        });

        // Animação de entrada dos elementos
        window.addEventListener('load', () => {
            document.querySelectorAll('.particle').forEach((particle, index) => {
                particle.style.animationDelay = `${index * 0.3}s`;
            });
        });
    </script>
</body>
</html>
